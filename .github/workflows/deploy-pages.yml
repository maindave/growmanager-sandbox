name: Deploy GrowManager Sandbox

on:
  push:
    branches: [main, sandbox]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sandbox-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Protect production isolation
        run: |
          grep -q "bpjcrfdsftjewjfspjpm" supabase-config.js
          if grep -q "rzkocbaztxasbnchgwwy" supabase-config.js; then exit 1; fi
      - name: Validate domain and database schema
        run: pnpm run test:domain && pnpm run test:supabase:schema
      - name: Build sandbox site
        run: pnpm run web:sync && touch www/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - name: Deploy sandbox
        id: deployment
        uses: actions/deploy-pages@v4
